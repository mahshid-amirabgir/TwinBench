# ============================================================================
meta:
  type:          "Articulated"                    # [DS] ✓
  dof:           6                                # [DS] ✓
  motor:         "Brushless AC Servomotor"        # [DS] ✓
  brakes:        "All axes"                       # [DS] ✓
  hard_stops:    "Adjustable mechanical stopper JT1/JT2/JT3"  # [DS] ✓
  installation:  "Floor, wall, ceiling"           # [DS] ✓
  controller:    "E30/E77"                        # [DS] ✓
  protection:
    wrist: "IP67"                                 # [DS] ✓
    base:  "IP65"                                 # [DS] ✓
  environment:
    temperature: "0 ~ 45 °C"                     # [DS] ✓
    humidity:    "35 ~ 85 % (no dew, no frost)"  # [DS] ✓
    vibration:   "< 0.5 G"                       # [DS] ✓
  built_in:
    harness:   "Sensor harness 12 inputs, 24VDC, GND"   # [DS] ✓
    utilities: "Pneumatic piping ø8 x 2 lines"          # [DS] ✓

