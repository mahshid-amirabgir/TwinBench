name: "Yaskawa MPX1950"
# ================================================================
#  SOURCE KEY:
#    [DS]      = Directly from datasheet (YR-MPX1950-C00, A-07-2019)
#    [DS-DRAW] = Read from mechanical drawing in datasheet
#    [DERIVED] = Calculated from DS values to satisfy Rmax constraint
#    [APX]     = Approximated — no direct datasheet source
#
#  VALIDATION (computed):
#    Max reach via grid search: 1.451 m (target 1.450 m, error 1.1 mm)
#    FK/IK round-trip benchmark: mean 0.389 mm, max 0.981 mm, 60/60 pass
#    5 mm guard threshold: 60/60 pass
# ================================================================
dh:
  convention: "craig"
  # Craig MDH a-index:
  #   a[0] = 0.0     base — zero in Craig convention
  #   a[1] = 0.470   [DS-DRAW] 470 mm upper arm label (Image 2, L-U)
  #   a[2] = 0.080   [DS-DRAW] 80 mm elbow offset (Image 1, near U-axis)
  #   a[3-5] = 0.0   spherical wrist — zero by construction
  a: [0.0, 0.470, 0.080, 0.0, 0.0, 0.0]

  # Standard Craig MDH alpha for 6R anthropomorphic arm with spherical wrist.
  # Same convention as KR6 R1820 and RS06L — identical across all three robots.
  # alpha: [0, -pi/2, 0, pi/2, -pi/2, pi/2]
  # Validated: FK/IK round-trip mean 0.389 mm, 60/60 pass.
  alpha: [0.0, -1.5707963, 0.0, 1.5707963, -1.5707963, 1.5707963]

  # d[0] = 0.340   [DS-DRAW] base height — 340 mm labeled in Image 1
  # d[3] = 0.605   [DERIVED] forearm length — unique value satisfying
  #                 Rmax=1450 mm under FK model with all other parameters
  #                 fixed to datasheet values. Determined by exhaustive
  #                 joint-space grid search. Achieved: 1.451 m.
  # d[4] = 0.095   [DS-DRAW] 95 +/- 0.1 mm (View C, Image 2)
  # d[5] = 0.183   [DS-DRAW] 183 +/- 0.1 mm (View C, Image 2)
  d: [0.340, 0.0, 0.0, 0.605, 0.095, 0.183]

  theta_offset: [0, 0, 0, 0, 0, 0]
  joint_sign:   [1, 1, 1, 1, 1, 1]

# ================================================================
#  JOINT LIMITS — ALL FROM DATASHEET [DS]
# ================================================================
joint_limits_deg:
  min: [-170, -100,  -62, -200, -150, -400]
  max: [ 170,  140,  235,  200,  150,  400]

# ================================================================
#  DYNAMICS
# ================================================================
dynamics:
  Rmax: 1.450            # [DS] Max. working range = 1450 mm
  rated_payload: 7.0     # [DS] Max. payload = 7 kg
  payload_used: 2.1      # [APX] = 0.30 x rated_payload (benchmark rule)

  # Joint velocities — all from [DS]
  qd_max_deg: [180, 180, 180, 360, 400, 500]

  # Link geometry for inertia approximation only (cylinder model).
  # NOT kinematic DH parameters.
  link_lengths: [0.34, 0.47, 0.08, 0.47, 0.095, 0.183]  # [APX]
  link_radii:   [0.10, 0.08, 0.07, 0.05, 0.045, 0.04]   # [APX]

  # Torque limits:
  #   J4-J6: from datasheet Allowable Moment column [DS]
  #   J1-J3: not in datasheet — approximated [APX]
  #   Defended by factorial sensitivity sweep (+/-20%)
  tau_max: [18.0, 18.0, 18.0, 19.6, 19.6, 9.8]

  # Inertia proxy:
  #   J4-J6: from datasheet Allowable Moment of Inertia column [DS]
  #   J1-J3: not in datasheet — approximated [APX]
  I_proxy: [0.40, 0.45, 0.40, 0.60, 0.60, 0.16]

  # Viscous friction — order-of-magnitude estimate [APX]
  # Friction torques below 2% of tau_max at 40% speed for all joints.
  # Covered by factorial uncertainty sweep.
  B_proxy: [0.06, 0.06, 0.06, 0.05, 0.05, 0.04]
